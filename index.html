<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>glitchyOS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="desktop" aria-label="glitchyOS desktop">
      <nav class="desktop-icons" aria-label="Desktop applications">
        <button class="desktop-icon" type="button" id="desktopIcon">
          <span class="icon-art" aria-hidden="true">ⓘ</span>
          <span>About Me</span>
        </button>
      </nav>

      <section class="window" id="welcome" aria-label="Welcome window" style="display: none;">
        <div class="window-header" id="welcomeheader">
          <span class="window-title">about-me.exe</span>
          <button class="close-button" id="welcomeclose" type="button" aria-label="Close window">×</button>
        </div>

        <div class="window-content">
          <p class="eyebrow">WELCOME TO</p>
          <h1>glitchyOS</h1>
          <h2>Hello, I'm Dee.</h2>
          <p>I'm a student and an indie game developer.</p>
          <p>I built this personal OS as my creative space for projects, ideas, and everything that makes me who I am.</p>
        </div>
      </section>

      <header class="top-bar">
        <button class="os-name" id="welcomeOpen" type="button">glitchyOS</button>
        <time id="timeElement" class="time" aria-label="Current time">--:--:--</time>
      </header>
    </main>

    <script src="script.js"></script>
  </body>
</html>
