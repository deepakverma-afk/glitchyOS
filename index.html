<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlitchyOS</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #050505;
            color: #fff;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* =========================
           BOOT SCREEN
        ========================= */

        #boot {
            position: fixed;
            inset: 0;
            background: #050505;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1000;
        }

        .boot-logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 4px;
            animation: flicker 1.5s infinite;
        }

        .boot-text {
            margin-top: 15px;
            color: #777;
            font-family: monospace;
            font-size: 13px;
        }

        .boot-loader {
            width: 180px;
            height: 3px;
            background: #222;
            margin-top: 25px;
            overflow: hidden;
        }

        .boot-loader span {
            display: block;
            height: 100%;
            width: 30%;
            background: white;
            animation: loading 1.4s infinite;
        }

        /* =========================
           DESKTOP
        ========================= */

        #desktop {
            position: fixed;
            inset: 0;
            display: none;
            background:
                radial-gradient(circle at 50% 45%, #202020 0%, #0d0d0d 45%, #050505 100%);
        }

        .noise {
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.035;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 2px,
                    #fff 3px
                );
        }

        .desktop-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .desktop-title {
            font-size: clamp(40px, 7vw, 90px);
            font-weight: 700;
            letter-spacing: -4px;
        }

        .desktop-subtitle {
            margin-top: 8px;
            color: #777;
            font-family: monospace;
        }

        /* =========================
           DESKTOP ICONS
        ========================= */

        .icons {
            position: absolute;
            top: 25px;
            left: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .icon {
            width: 75px;
            text-align: center;
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: 0.15s;
        }

        .icon:hover {
            background: rgba(255,255,255,0.08);
        }

        .icon-symbol {
            font-size: 30px;
            margin-bottom: 6px;
        }

        .icon-name {
            font-size: 12px;
            color: #ddd;
        }

        /* =========================
           TASKBAR
        ========================= */

        .taskbar {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 55px;
            background: rgba(12,12,12,0.82);
            backdrop-filter: blur(18px);
            border-top: 1px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .start-button {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
            transition: 0.15s;
        }

        .start-button:hover {
            background: rgba(255,255,255,0.1);
        }

        .taskbar-time {
            margin-left: auto;
            font-family: monospace;
            font-size: 12px;
            color: #aaa;
        }

        /* =========================
           START MENU
        ========================= */

        #start-menu {
            position: absolute;
            bottom: 68px;
            left: 15px;
            width: 300px;
            padding: 18px;
            background: rgba(18,18,18,0.9);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            display: none;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }

        #start-menu h2 {
            font-size: 17px;
            margin-bottom: 15px;
        }

        .menu-item {
            padding: 12px;
            border-radius: 8px;
            color: #bbb;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.08);
            color: white;
        }

        /* =========================
           GLITCH EFFECT
        ========================= */

        .glitch {
            animation: glitch 0.15s infinite;
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
            }

            25% {
                transform: translate(2px, -1px);
            }

            50% {
                transform: translate(-2px, 1px);
            }

            75% {
                transform: translate(1px, 2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes flicker {
            0%, 100% {
                opacity: 1;
            }

            50% {
                opacity: 0.65;
            }

            55% {
                opacity: 0.2;
            }

            60% {
                opacity: 0.9;
            }
        }

        @keyframes loading {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(600%);
            }
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {
            .desktop-title {
                font-size: 50px;
            }

            #start-menu {
                width: calc(100vw - 30px);
            }
        }
    </style>
</head>

<body>

    <!-- BOOT SCREEN -->

    <div id="boot">
        <div class="boot-logo">GlitchyOS</div>
        <div class="boot-text" id="boot-text">
            initializing system...
        </div>

        <div class="boot-loader">
            <span></span>
        </div>
    </div>


    <!-- DESKTOP -->

    <div id="desktop">

        <div class="noise"></div>

        <!-- Desktop Icons -->

        <div class="icons">

            <div class="icon" onclick="openComputer()">
                <div class="icon-symbol">▣</div>
                <div class="icon-name">Computer</div>
            </div>

            <div class="icon" onclick="openNotes()">
                <div class="icon-symbol">▤</div>
                <div class="icon-name">Notes</div>
            </div>

        </div>


        <!-- Center -->

        <div class="desktop-content">

            <div class="desktop-title" id="title">
                GlitchyOS
            </div>

            <div class="desktop-subtitle">
                welcome back, user.
            </div>

        </div>


        <!-- Start Menu -->

        <div id="start-menu">

            <h2>GlitchyOS</h2>

            <div class="menu-item" onclick="glitchSystem()">
                System
            </div>

            <div class="menu-item" onclick="openNotes()">
                Notes
            </div>

            <div class="menu-item" onclick="shutdown()">
                Shut down
            </div>

        </div>


        <!-- Taskbar -->

        <div class="taskbar">

            <div class="start-button" onclick="toggleStart()">
                ◈
            </div>

            <div class="taskbar-time" id="clock">
                00:00
            </div>

        </div>

    </div>


    <script>

        /* =========================
           BOOT
        ========================= */

        const bootMessages = [
            "initializing system...",
            "loading kernel...",
            "checking memory...",
            "starting graphical interface...",
            "almost there...",
            "welcome."
        ];

        let messageIndex = 0;

        const bootText = document.getElementById("boot-text");

        const bootInterval = setInterval(() => {

            messageIndex++;

            if (messageIndex < bootMessages.length) {
                bootText.textContent = bootMessages[messageIndex];
            }

        }, 500);


        setTimeout(() => {

            clearInterval(bootInterval);

            document.getElementById("boot").style.display = "none";
            document.getElementById("desktop").style.display = "block";

        }, 3200);


        /* =========================
           CLOCK
        ========================= */

        function updateClock() {

            const now = new Date();

            let hours = String(now.getHours()).padStart(2, "0");
            let minutes = String(now.getMinutes()).padStart(2, "0");

            document.getElementById("clock").textContent =
                `${hours}:${minutes}`;
        }

        updateClock();

        setInterval(updateClock, 1000);


        /* =========================
           START MENU
        ========================= */

        function toggleStart() {

            const menu = document.getElementById("start-menu");

            if (menu.style.display === "block") {
                menu.style.display = "none";
            } else {
                menu.style.display = "block";
            }
        }


        /* =========================
           GLITCH
        ========================= */

        function glitchSystem() {

            const title = document.getElementById("title");

            title.classList.add("glitch");

            setTimeout(() => {
                title.classList.remove("glitch");
            }, 1000);
        }


        /* =========================
           PLACEHOLDER APPS
        ========================= */

        function openComputer() {

            alert("Computer.exe is currently unavailable.");
        }


        function openNotes() {

            alert("Notes.exe has not been installed yet.");
        }


        /* =========================
           SHUTDOWN
        ========================= */

        function shutdown() {

            document.getElementById("desktop").style.display = "none";

            document.getElementById("boot").style.display = "flex";

            document.getElementById("boot-text").textContent =
                "shutting down...";
        }

    </script>

</body>
</html>
